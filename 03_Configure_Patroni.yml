---
- name: Configure PostgreSQL and Patroni HA Cluster
  hosts: pg_nodes
  become: true
  gather_facts: true
  vars_files:
    - credentials.yaml

  tasks:
    - name: Set OS-specific paths (Debian/Ubuntu)
      set_fact:
        base_data_dir: "/postgres/data/{{ pg_version }}"
        data_dir: "/postgres/data/{{ pg_version }}/{{ patroni_scope }}"
        pg_bin_dir: "/usr/lib/postgresql/{{ pg_version }}/bin"
        pg_socket_dir: "/var/run/postgresql"
        pg_service: "postgresql"
        pg_ctl: "/usr/bin/pg_ctlcluster"
      when: ansible_os_family == "Debian"

    - name: Set OS-specific paths (RHEL/CentOS)
      set_fact:
        base_data_dir: "/var/lib/pgsql/{{ pg_version }}"
        data_dir: "/var/lib/pgsql/{{ pg_version }}/data/{{ patroni_scope }}"
        pg_bin_dir: "/usr/pgsql-{{ pg_version }}/bin"
        pg_socket_dir: "/var/run/postgresql"
        pg_service: "postgresql-{{ pg_version }}"
        pg_ctl: "/usr/pgsql-{{ pg_version }}/bin/pg_ctl"
      when: ansible_os_family == "RedHat"

    # ============================================================
    # PG TUNE: Calculate optimal PostgreSQL parameters based on VM resources
    # Inspired by https://github.com/le0pard/pgtune
    # ============================================================
    - name: Gather system memory and CPU facts for pgtune calculation
      setup:
        filter: ansible_*memory*,ansible_processor*

    - name: Calculate optimal PostgreSQL parameters (pgtune algorithm)
      set_fact:
        # Memory in MB
        total_ram_mb: "{{ ansible_memtotal_mb }}"
        cpu_cores: "{{ ansible_processor_cores | default(ansible_processor_vcpus | default(4)) }}"
        # Map credentials.yaml vars to playbook vars
        scope: "{{ patroni_scope }}"
        # pgtune calculations
        pg_shared_buffers_mb: "{{ [ (ansible_memtotal_mb * 0.25) | int, 32768 ] | min }}"
        pg_effective_cache_size_mb: "{{ (ansible_memtotal_mb * 0.75) | int }}"
        pg_maintenance_work_mem_mb: "{{ 512 if ansible_memtotal_mb <= 4096 else (1024 if ansible_memtotal_mb <= 16384 else 2048) }}"
        # max_connections: web/oltp workload default
        pg_max_connections: "{{ [ 200, [ 100, (ansible_processor_cores | default(4) * 50) | int ] | max ] | min }}"
        # work_mem: ensure total work_mem * max_connections * 2 < 25% RAM
        pg_work_mem_kb: "{{ [ 4096, [ ( (ansible_memtotal_mb * 1024 * 0.25) / ( ([ 200, [ 100, (ansible_processor_cores | default(4) * 50) | int ] | max ] * 2 ) ) ) | int, 262144 ] | min ] | max }}"
        # wal_buffers: min(16MB, 3% of shared_buffers)
        pg_wal_buffers_kb: "{{ [ 16384, (pg_shared_buffers_mb * 1024 * 0.03) | int ] | min }}"
        # WAL sizes
        pg_min_wal_size_mb: 1024
        pg_max_wal_size_mb: "{{ [ 4096, [ 1024, (ansible_memtotal_mb * 0.05) | int ] | max ] | min }}"
        # Parallel settings
        pg_max_worker_processes: "{{ [ ansible_processor_cores | default(4), 8 ] | min }}"
        pg_max_parallel_workers_per_gather: "{{ [ (ansible_processor_cores | default(4) // 2), 4 ] | min }}"
        pg_max_parallel_workers: "{{ [ ansible_processor_cores | default(4), 8 ] | min }}"
        # Storage-aware settings (assume SSD for cloud VMs)
        pg_random_page_cost: 1.1
        pg_effective_io_concurrency: 200
        # Checkpoint
        pg_checkpoint_completion_target: 0.9
        # JIT (PG 11+)
        pg_jit: "{{ 'on' if (ansible_processor_cores | default(4)) >= 4 else 'off' }}"

    - name: Display calculated PostgreSQL parameters
      debug:
        msg:
          - "=== PG TUNE CALCULATED PARAMETERS ==="
          - "Total RAM: {{ total_ram_mb }} MB"
          - "CPU Cores: {{ cpu_cores }}"
          - "shared_buffers: {{ pg_shared_buffers_mb }} MB"
          - "effective_cache_size: {{ pg_effective_cache_size_mb }} MB"
          - "maintenance_work_mem: {{ pg_maintenance_work_mem_mb }} MB"
          - "work_mem: {{ pg_work_mem_kb }} kB"
          - "max_connections: {{ pg_max_connections }}"
          - "wal_buffers: {{ pg_wal_buffers_kb }} kB"
          - "min_wal_size: {{ pg_min_wal_size_mb }} MB"
          - "max_wal_size: {{ pg_max_wal_size_mb }} MB"
          - "checkpoint_completion_target: {{ pg_checkpoint_completion_target }}"
          - "random_page_cost: {{ pg_random_page_cost }}"
          - "effective_io_concurrency: {{ pg_effective_io_concurrency }}"
          - "max_worker_processes: {{ pg_max_worker_processes }}"
          - "max_parallel_workers_per_gather: {{ pg_max_parallel_workers_per_gather }}"
          - "max_parallel_workers: {{ pg_max_parallel_workers }}"
          - "jit: {{ pg_jit }}"
          - "=========================================="

    - name: Set cluster facts
      set_fact:
        node_name: "{{ ansible_hostname }}"
        node_ip: "{{ ansible_default_ipv4.address }}"
        is_primary: "{{ inventory_hostname == groups['pg_nodes'][0] }}"

    - name: Display OS-specific paths
      debug:
        msg:
          - "OS Family: {{ ansible_os_family }}"
          - "Data dir: {{ data_dir }}"
          - "Bin dir: {{ pg_bin_dir }}"
          - "Service: {{ pg_service }}"

    # Enhanced Cleanup Section
    - name: Stop all related services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - patroni
        - "{{ pg_service }}"
      ignore_errors: true

    - name: Remove the PostgreSQL cluster (Debian/Ubuntu - pg_dropcluster)
      ansible.builtin.shell: |
        sudo pg_dropcluster {{ pg_version }} "{{ patroni_scope }}"
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Remove the PostgreSQL cluster (RHEL/CentOS - remove data dir)
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: absent
        force: yes
      ignore_errors: true
      when: ansible_os_family == "RedHat"

    # PostgreSQL Initialization - ONLY ON PRIMARY
    - name: Create PostgreSQL cluster using pg_createcluster on primary node only (Debian/Ubuntu)
      ansible.builtin.command: sudo pg_createcluster {{ pg_version }} {{ patroni_scope }} -d {{ data_dir }}
      when: ansible_os_family == "Debian" and is_primary

    # Stop the PostgreSQL cluster
    - name: Stop the PostgreSQL cluster (Debian/Ubuntu)
      ansible.builtin.shell: |
        sudo /usr/bin/pg_ctlcluster "{{ pg_version }}-{{ patroni_scope }}" stop
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Stop the PostgreSQL cluster (RHEL/CentOS)
      ansible.builtin.systemd:
        name: "{{ pg_service }}"
        state: stopped
      ignore_errors: true
      when: ansible_os_family == "RedHat"

    - name: Remove all configuration and data files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
        force: yes
      loop:
        - /etc/patroni/patroni.yml
        - /etc/patroni/patroni.yaml
        - /etc/systemd/system/patroni.service
        - "{{ data_dir }}"
        - "{{ base_data_dir }}"
        - /postgres/pgbackup/*
        - /var/lib/postgresql/12/*
        - /var/run/postgresql/*
      ignore_errors: yes

    - name: Ensure data directory is empty
      ansible.builtin.stat:
        path: "{{ data_dir }}"
      register: data_dir_stat

    - name: Remove data directory if it exists
      ansible.builtin.command: rm -rf {{ data_dir }}
      when: data_dir_stat.stat.exists

    # Enhanced ETCD Cleanup
    - name: Perform complete ETCD cleanup
      ansible.builtin.shell: |
        for key in \
          "/{{ namespace }}/{{ patroni_scope }}" \
          "/{{ namespace }}/{{ patroni_scope }}/leader" \
          "/{{ namespace }}/{{ patroni_scope }}/system_id" \
          "/{{ namespace }}/{{ patroni_scope }}/initialize" \
          "/{{ namespace }}/{{ patroni_scope }}/members" \
          "/{{ namespace }}/{{ patroni_scope }}/config"
        do
          /usr/bin/etcdctl --endpoints="{{ etcd_endpoints }}" del "$key" --prefix
        done
      ignore_errors: yes

    # Verification of Cleanup
    - name: Verify cleanup
      block:
        - name: Check data directory is empty
          ansible.builtin.stat:
            path: "{{ data_dir }}"
          register: data_dir_stat

        - name: Check ETCD keys
          ansible.builtin.shell: "etcdctl --endpoints='{{ etcd_endpoints }}' get '/{{ namespace }}/{{ scope }}' --prefix | wc -l"
          register: etcd_keys
          ignore_errors: yes

        - name: Display cleanup status
          ansible.builtin.debug:
            msg:
              - "Data directory exists: {{ data_dir_stat.stat.exists }}"
              - "ETCD keys found: {{ etcd_keys.stdout|int }}"

    - name: Wait for cleanup to settle
      ansible.builtin.pause:
        seconds: 10

    # Directory Setup
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ base_data_dir }}", mode: '0755' }
        - { path: "{{ data_dir }}", mode: '0700' }
        - { path: "/postgres/pgbackup/kyc/archive", mode: '0700' }
        - { path: "/etc/patroni", mode: '0755' }
        - { path: "{{ pg_socket_dir }}", mode: '0755' }

    - name: Create Patroni configuration file
      ansible.builtin.blockinfile:
        path: "/etc/patroni/patroni.yml"
        create: yes
        mode: '0644'
        owner: postgres
        group: postgres
        block: |
          namespace: {{ namespace }}
          scope: {{ scope }}
          name: {{ node_name }}

          restapi:
              listen: 0.0.0.0:8008
              connect_address: {{ node_ip }}:8008

          etcd3:
              host: {{ node_ip }}:2379

          bootstrap:
            dcs:
                ttl: 30
                loop_wait: 10
                retry_timeout: 10
                maximum_lag_on_failover: 1048576

                postgresql:
                    use_pg_rewind: true
                    use_slots: true
                    parameters:
                        # --- PG TUNE CALCULATED PARAMETERS ---
                        shared_buffers: "{{ pg_shared_buffers_mb }}MB"
                        effective_cache_size: "{{ pg_effective_cache_size_mb }}MB"
                        maintenance_work_mem: "{{ pg_maintenance_work_mem_mb }}MB"
                        work_mem: "{{ pg_work_mem_kb }}kB"
                        max_connections: {{ pg_max_connections }}
                        wal_buffers: "{{ pg_wal_buffers_kb }}kB"
                        min_wal_size: "{{ pg_min_wal_size_mb }}MB"
                        max_wal_size: "{{ pg_max_wal_size_mb }}MB"
                        checkpoint_completion_target: {{ pg_checkpoint_completion_target }}
                        random_page_cost: {{ pg_random_page_cost }}
                        effective_io_concurrency: {{ pg_effective_io_concurrency }}
                        max_worker_processes: {{ pg_max_worker_processes }}
                        max_parallel_workers_per_gather: {{ pg_max_parallel_workers_per_gather }}
                        max_parallel_workers: {{ pg_max_parallel_workers }}
                        parallel_leader_participation: on
                        jit: {{ pg_jit }}
                        # --- REPLICATION SETTINGS ---
                        wal_level: replica
                        hot_standby: "on"
                        max_wal_senders: 10
                        max_replication_slots: 20
                        wal_log_hints: "on"
                        wal_keep_size: "1GB"
                        # --- LOGGING ---
                        logging_collector: 'on'
                        log_destination: 'stderr'
                        log_min_duration_statement: 1000
                        log_checkpoints: on
                        log_connections: on
                        log_disconnections: on
                        log_lock_waits: on
                        log_temp_files: 0
                        log_autovacuum_min_duration: 0
                        # --- AUTOVACUUM ---
                        autovacuum: 'on'
                        autovacuum_max_workers: 3
                        autovacuum_naptime: 30s
                        autovacuum_vacuum_threshold: 50
                        autovacuum_analyze_threshold: 50
                        autovacuum_vacuum_scale_factor: 0.1
                        autovacuum_analyze_scale_factor: 0.05
                        # --- ARCHIVE ---
                        archive_mode: "on"
                        archive_timeout: 600s
                        archive_command: "cp -f %p /postgres/pgbackup/kyc/archive/%f"

            initdb:
                - encoding: UTF8
                - data-checksums

            pg_hba:
                - host replication replicator 127.0.0.1/32 trust
                - host replication replicator 0.0.0.0/0 scram-sha-256
                - host all all 0.0.0.0/0 scram-sha-256
                - host all all ::0/0 scram-sha-256

            users:
                admin:
                    password: "{{ patroni_admin_password }}"
                    options:
                        - createrole
                        - createdb
                percona:
                    password: "{{ percona_password }}"
                    options:
                        - createrole
                        - createdb
                pgpool:
                    password: "{{ pgpool_password }}"
                    options:
                        - createrole
                        - createdb

          postgresql:
              cluster_name: "{{ cluster_name }}"
              listen: 0.0.0.0:5432
              connect_address: {{ node_ip }}:5432
              data_dir: {{ data_dir }}
              bin_dir: {{ pg_bin_dir }}
              pgpass: /tmp/pgpass0
              authentication:
                  replication:
                      username: "{{ replicator_username }}"
                      password: "{{ replicator_password }}"
                  superuser:
                      username: postgres
                      password: "{{ postgres_password }}"
              parameters:
                  unix_socket_directories: "{{ pg_socket_dir }}"
              create_replica_methods:
                  - basebackup
              basebackup:
                  checkpoint: 'fast'

          tags:
              nofailover: false
              noloadbalance: false
              clonefrom: false
              nosync: false

    - name: Pause for Patroni to settle
      ansible.builtin.pause:
        seconds: 10

    - name: Validate Patroni configuration
      ansible.builtin.command: patroni --validate-config /etc/patroni/patroni.yml

    # Systemd Setup
    - name: Create Patroni systemd service
      ansible.builtin.blockinfile:
        path: "/etc/systemd/system/patroni.service"
        create: yes
        mode: '0644'
        owner: root
        group: root
        block: |
          [Unit]
          Description=Runners to orchestrate a high-availability PostgreSQL
          After=syslog.target network.target etcd.service

          [Service]
          Type=simple
          User=postgres
          Group=postgres
          ExecStart={{ '/usr/bin/patroni' if ansible_os_family == 'RedHat' else '/bin/patroni' }} /etc/patroni/patroni.yml
          ExecReload=/bin/kill -s HUP $MAINPID
          KillMode=process
          TimeoutSec=30
          Restart=always
          RestartSec=10s

          [Install]
          WantedBy=multi-user.target

    # Service Management - Starting in the right order
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes

    # Start primary first
    - name: Start Patroni on primary node
      ansible.builtin.systemd:
        name: patroni
        state: started
        enabled: yes
      when: is_primary

    - name: Wait for primary to initialize
      ansible.builtin.pause:
        seconds: 10
      when: is_primary

    # Then start secondaries
    - name: Start Patroni on replica nodes
      ansible.builtin.systemd:
        name: patroni
        state: started
        enabled: yes
      when: not is_primary

    - name: Create patronictl alias
      ansible.builtin.blockinfile:
        path: /etc/profile.d/patroni-alias.sh
        create: yes
        mode: '0644'
        block: |
          alias patronictl='patronictl -c /etc/patroni/patroni.yml'

    # Final Verification
    - name: Wait for cluster to stabilize
      ansible.builtin.pause:
        seconds: 15

    - name: Check cluster status
      ansible.builtin.shell: patronictl -c /etc/patroni/patroni.yml list
      register: cluster_status
      ignore_errors: yes

    - name: Display cluster status
      ansible.builtin.debug:
        var: cluster_status.stdout_lines