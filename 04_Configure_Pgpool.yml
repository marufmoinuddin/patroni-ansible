---
- name: Install and Configure Pgpool-II with Watchdog on all PostgreSQL nodes
  hosts: pg_nodes
  become: true
  gather_facts: true
  vars_files:
    - credentials.yaml
  vars:
    # OS-specific paths (computed from credentials.yaml vars)
    data_dir: "{{ '/postgres/data/' ~ pg_version ~ '/' ~ patroni_scope if ansible_os_family == 'Debian' else '/var/lib/pgsql/' ~ pg_version ~ '/data/' ~ patroni_scope }}"
    patroni_config: "/etc/patroni/patroni.yml"
    pgpool_conf_dir: "{{ '/etc/pgpool2' if ansible_os_family == 'Debian' else '/etc/pgpool-II' }}"
    pgpool_service_name: "{{ 'pgpool2' if ansible_os_family == 'Debian' else 'pgpool' }}"
    pgpool_log_dir: "{{ '/var/log/pgpool2' if ansible_os_family == 'Debian' else '/var/log/pgpool' }}"
    pg_md5_bin: "/usr/bin/pg_md5"
    if_cmd_path: "/usr/sbin"
    arping_path: "/usr/sbin"
    psql_path: "{{ '/usr/bin/psql' if ansible_os_family == 'Debian' else '/usr/pgsql-16/bin/psql' }}"
    # Pgpool users (from credentials.yaml)
    pgpool_admin_user: "pgpool_admin"
    pgpool_admin_password: "{{ pgpool_admin_password }}"
    pcp_user: "{{ pcp_user }}"
    pcp_password: "{{ pcp_password }}"
    health_check_user: "{{ health_check_user }}"
    health_check_password: "{{ health_check_password }}"
    # Network
    vip: "{{ vip_address }}"
    vip_interface: "{{ vip_interface }}"
    vip_cidr: "{{ vip_cidr }}"
    pgpool_port: 9999
    pcp_port: "{{ pcp_port }}"
    wd_port: "{{ wd_port }}"

  tasks:
    - name: Set node-specific facts
      set_fact:
        node_name: "{{ ansible_hostname }}"
        node_ip: "{{ ansible_default_ipv4.address }}"
        node_index: "{{ groups['pg_nodes'].index(inventory_hostname) + 1 }}"
        is_first_node: "{{ inventory_hostname == groups['pg_nodes'][0] }}"

    - name: Display node info
      debug:
        msg:
          - "Node: {{ node_name }} ({{ node_ip }})"
          - "Index: {{ node_index }}"
          - "Is first: {{ is_first_node }}"
          - "OS: {{ ansible_os_family }}"
          - "Config dir: {{ pgpool_conf_dir }}"
          - "Service: {{ pgpool_service_name }}"
          - "Data dir: {{ data_dir }}"

    # ============================================================
    # 1. INSTALL PGROOL-II FROM PERCONA REPOS
    # ============================================================
    - name: Install Pgpool-II (Debian/Ubuntu)
      apt:
        name:
          - percona-pgpool16
          - postgresql-16-pgpool2
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Pgpool-II (RHEL/CentOS)
      dnf:
        name:
          - percona-pgpool-II-pg16
          - percona-pgpool-II-pg16-extensions
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure Pgpool log directory exists
      file:
        path: "{{ pgpool_log_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0755'

    # ============================================================
    # 2. CREATE PGROOL USERS IN POSTGRESQL (ON PRIMARY)
    # ============================================================
    # NOTE: psql is NOT on PATH for the postgres user on a clean RHEL install.
    # Use the absolute path (RHEL: /usr/pgsql-16/bin/psql, Debian: /usr/bin/psql).
    # We must target the *current* Patroni leader (which may not be db1 after failover).
    - name: Discover current Patroni leader via REST API
      uri:
        url: "http://{{ item }}:8008/patroni"
        method: GET
        timeout: 5
      loop: "{{ groups['pg_nodes'] }}"
      register: patroni_cluster
      failed_when: false
      changed_when: false
      run_once: true
      delegate_to: "{{ groups['pg_nodes'][0] }}"

    - name: Set leader_fact from Patroni REST
      set_fact:
        patroni_leader: "{{ patroni_cluster.results | selectattr('json.role', 'equalto', 'Leader') | map(attribute='item') | first }}"
        patroni_leader_ip: "{{ patroni_cluster.results | selectattr('json.role', 'equalto', 'Leader') | map(attribute='item') | first }}"
      run_once: true

    - name: Create Pgpool users in PostgreSQL (on current primary only)
      block:
        - name: Create pgpool_admin user
          shell: |
            su - postgres -c "{{ psql_path }} -c \"CREATE USER {{ pgpool_admin_user }} WITH SUPERUSER PASSWORD '{{ pgpool_admin_password }}';\" || {{ psql_path }} -c \"ALTER USER {{ pgpool_admin_user }} WITH SUPERUSER PASSWORD '{{ pgpool_admin_password }}';\""
          delegate_to: "{{ patroni_leader }}"
          run_once: true
          ignore_errors: true

        - name: Create pcp user (for PCP commands)
          shell: |
            su - postgres -c "{{ psql_path }} -c \"CREATE USER {{ pcp_user }} WITH SUPERUSER PASSWORD '{{ pcp_password }}';\" || {{ psql_path }} -c \"ALTER USER {{ pcp_user }} WITH SUPERUSER PASSWORD '{{ pcp_password }}';\""
          delegate_to: "{{ patroni_leader }}"
          run_once: true
          ignore_errors: true

        - name: Create health check user (pgpool)
          shell: |
            su - postgres -c "{{ psql_path }} -c \"CREATE USER {{ health_check_user }} WITH PASSWORD '{{ health_check_password }}';\" || {{ psql_path }} -c \"ALTER USER {{ health_check_user }} WITH PASSWORD '{{ health_check_password }}';\""
          delegate_to: "{{ patroni_leader }}"
          run_once: true
          ignore_errors: true
      when: is_first_node

    # ============================================================
    # 3. AUTH FILES: pool_passwd (PLAINTEXT for SCRAM), pcp.conf
    # ============================================================
    # Pgpool 4.7 + PostgreSQL 16 uses SCRAM-SHA-256:
    # pool_passwd must contain PLAINTEXT passwords (NOT md5 hashes).
    - name: Create pool_passwd file (plaintext for SCRAM)
      copy:
        dest: "{{ pgpool_conf_dir }}/pool_passwd"
        content: |
          {{ pgpool_admin_user }}:{{ pgpool_admin_password }}
          {{ health_check_user }}:{{ health_check_password }}
        owner: postgres
        group: postgres
        mode: '0640'
      notify: restart pgpool

    # pcp.conf: requires MD5-hashed password (pgpool 4.x)
    - name: Create pcp.conf (MD5-hashed password)
      shell: |
        HASH=$(pg_md5 {{ pcp_password }})
        echo "{{ pcp_user }}:$HASH" > {{ pgpool_conf_dir }}/pcp.conf
        chown postgres:postgres {{ pgpool_conf_dir }}/pcp.conf
        chmod 0640 {{ pgpool_conf_dir }}/pcp.conf
      changed_when: false
      notify: restart pgpool

    # .pcppass: plaintext credentials so pcp_* commands run non-interactively
    - name: Create .pcppass file for PCP commands
      copy:
        dest: "{{ pgpool_conf_dir }}/.pcppass"
        content: |
          *:{{ pcp_port }}:{{ pcp_user }}:{{ pcp_password }}
        owner: postgres
        group: postgres
        mode: '0600'
      notify: restart pgpool

    # pgpool_node_id: REQUIRED by Pgpool 4.7 (0,1,2 per node)
    - name: Create pgpool_node_id file
      copy:
        dest: "{{ pgpool_conf_dir }}/pgpool_node_id"
        content: "{{ node_index | int - 1 }}\n"
        owner: postgres
        group: postgres
        mode: '0644'
      notify: restart pgpool

    # pool_hba.conf: governs client auth through Pgpool (scram, no hostssl)
    - name: Create pool_hba.conf
      copy:
        dest: "{{ pgpool_conf_dir }}/pool_hba.conf"
        content: |
          # Pgpool-II Host Based Authentication
          # TYPE  DATABASE        USER            ADDRESS                 METHOD
          local   all             all                                     trust
          host    all             all             127.0.0.1/32            scram-sha-256
          host    all             all             192.168.122.0/24        scram-sha-256
          host    all             all             0.0.0.0/0               scram-sha-256
        owner: postgres
        group: postgres
        mode: '0644'
      notify: restart pgpool

    # ============================================================
    # 4. CONFIGURE PGROOL-II (pgpool.conf) - ALL INLINE
    # ============================================================
    - name: Configure pgpool.conf
      copy:
        dest: "{{ pgpool_conf_dir }}/pgpool.conf"
        owner: postgres
        group: postgres
        mode: '0644'
        content: |
          # ============================================================
          # Pgpool-II Configuration for PostgreSQL {{ pg_version }} + Patroni
          # Generated by Ansible - DO NOT EDIT DIRECTLY
          # ============================================================

          # ----------------------------------------------------------------------
          # CONNECTION SETTINGS
          # ----------------------------------------------------------------------
          listen_addresses = '*'
          port = {{ pgpool_port }}
          socket_dir = '/var/run/postgresql'
          pcp_listen_addresses = '*'
          pcp_port = {{ pcp_port }}
          pcp_socket_dir = '/var/run/postgresql'

          # ----------------------------------------------------------------------
          # BACKEND NODES (Patroni-managed PostgreSQL instances)
          # ----------------------------------------------------------------------
          {% for node in groups['pg_nodes'] %}
          backend_hostname{{ loop.index0 }} = '{{ hostvars[node]['ansible_default_ipv4']['address'] }}'
          backend_port{{ loop.index0 }} = 5432
          backend_weight{{ loop.index0 }} = 1
          backend_data_directory{{ loop.index0 }} = '{{ data_dir }}'
          backend_flag{{ loop.index0 }} = 'ALLOW_TO_FAILOVER'
          {% endfor %}

          # ----------------------------------------------------------------------
          # AUTHENTICATION
          # ----------------------------------------------------------------------
          enable_pool_hba = on
          pool_passwd = 'pool_passwd'
          authentication_timeout = 60
          ssl = off  # Set to 'on' with certs for production

          # ----------------------------------------------------------------------
          # LOAD BALANCING
          # ----------------------------------------------------------------------
          load_balance_mode = on
          ignore_leading_white_space = on
          white_function_list = ''
          black_function_list = 'nextval,setval,lastval,currval'
          database_redirect_preference_list = ''
          app_name_redirect_preference_list = ''
          allow_sql_comments = off

          # ----------------------------------------------------------------------
          # MASTER/SLAVE MODE (Streaming Replication with Patroni)
          # ----------------------------------------------------------------------
          master_slave_mode = on
          master_slave_sub_mode = 'stream'

          # Health check configuration
          health_check_period = 5
          health_check_timeout = 10
          health_check_user = '{{ health_check_user }}'
          health_check_password = '{{ health_check_password }}'
          health_check_database = 'postgres'
          health_check_max_retries = 3
          health_check_retry_delay = 1
          connect_timeout = 10

          # Failover / Failback
          failover_command = '{{ pgpool_conf_dir }}/failover.sh %d %h %p %D %m %H %M %P %r %R'
          failback_command = ''
          follow_master_command = '{{ pgpool_conf_dir }}/follow_master.sh %d %h %p %D %m %H %M %P %r %R'

          # ----------------------------------------------------------------------
          # WATCHDOG (High Availability) - Pgpool 4.7+ parameter names
          # ----------------------------------------------------------------------
          use_watchdog = on
          wd_lifecheck_method = heartbeat
          wd_monitoring_interfaces_list = '{{ vip_interface }}'
          # Watchdog nodes - indexed tuples, ALL 3 on EVERY node (Pgpool 4.7 format)
          {% for node in groups['pg_nodes'] %}
          hostname{{ loop.index0 }} = '{{ hostvars[node]['ansible_default_ipv4']['address'] }}'
          wd_port{{ loop.index0 }} = {{ wd_port }}
          pgpool_port{{ loop.index0 }} = {{ pgpool_port }}
          {% endfor %}
          # Local node priority + auth key (single params, not indexed, in 4.7)
          wd_priority = {{ wd_priority_base + (3 - (node_index | int)) }}
          wd_authkey = ''

          # Heartbeat lifecheck - 4.7 names (heartbeat_hostname/port/device)
          {% for node in groups['pg_nodes'] %}
          heartbeat_hostname{{ loop.index0 }} = '{{ hostvars[node]['ansible_default_ipv4']['address'] }}'
          heartbeat_port{{ loop.index0 }} = {{ wd_port }}
          heartbeat_device{{ loop.index0 }} = '{{ vip_interface }}'
          {% endfor %}

          # Virtual IP (VIP) management
          delegate_ip = '{{ vip }}'
          if_cmd_path = '{{ if_cmd_path }}'
          if_up_cmd = '{{ if_cmd_path }}/ip addr add {{ vip }}/{{ vip_cidr }} dev {{ vip_interface }} label {{ vip_interface }}:pgpool'
          if_down_cmd = '{{ if_cmd_path }}/ip addr del {{ vip }}/{{ vip_cidr }} dev {{ vip_interface }}'
          arping_path = '{{ arping_path }}'
          arping_cmd = '{{ arping_path }}/arping -U {{ vip }} -w 1 -I {{ vip_interface }}'

          # ----------------------------------------------------------------------
          # POOLING SETTINGS (Production tuned)
          # ----------------------------------------------------------------------
          # num_init_children: max concurrent child processes
          # For web workload: 32-64, for OLTP: 64-128
          num_init_children = 64
          # max_pool: max connections per child (per database/user)
          max_pool = 4
          # Connection lifecycle
          child_life_time = 3600
          child_max_connections = 1000
          connection_life_time = 0
          client_idle_limit = 300
          # Reset query to clean session state
          reset_query_list = 'ABORT; DISCARD ALL'

          # ----------------------------------------------------------------------
          # LOGGING (Production ready)
          # ----------------------------------------------------------------------
          log_destination = 'stderr'
          log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
          log_connections = on
          log_hostname = off
          log_statement = 'ddl'
          log_per_node_statement = on
          log_standby_delay = 'always'
          log_min_messages = 'info'

          # ----------------------------------------------------------------------
          # FILE LOCATIONS
          # ----------------------------------------------------------------------
          pid_file_name = '/var/run/pgpool/{{ pgpool_service_name }}.pid'
          logdir = '{{ pgpool_log_dir }}'

          # ----------------------------------------------------------------------
          # HEALTH CHECK SETTINGS (Optimized for Patroni)
          # ----------------------------------------------------------------------
          # Streaming replication check
          sr_check_period = 5
          sr_check_user = '{{ health_check_user }}'
          sr_check_password = '{{ health_check_password }}'
          sr_check_database = 'postgres'
          # Health check
          health_check_period = 10
          health_check_timeout = 20
          health_check_user = '{{ health_check_user }}'
          health_check_password = '{{ health_check_password }}'
          health_check_database = 'postgres'
          health_check_max_retries = 3
          health_check_retry_delay = 1

          # ----------------------------------------------------------------------
          # FAILOVER SETTINGS
          # ----------------------------------------------------------------------
          failover_command = '{{ pgpool_conf_dir }}/failover.sh %d %h %p %D %m %H %M %P %r %R'
          failback_command = ''
          # follow_master_command = '{{ pgpool_conf_dir }}/follow_master.sh %d %h %p %D %m %H %M %P %r %R'
          failover_on_backend_error = on
          search_primary_node_timeout = 10

          # ----------------------------------------------------------------------
          # SSL (Enable for production with certs)
          # ----------------------------------------------------------------------
          ssl = off
          # ssl_cert = '/etc/pgpool-II/certs/server.crt'
          # ssl_key = '/etc/pgpool-II/certs/server.key'
          # ssl_ca_cert = '/etc/pgpool-II/certs/ca.crt'

          # ----------------------------------------------------------------------
          # MEMORY/QUERY CACHE
          # ----------------------------------------------------------------------
          memory_cache_enabled = off
          # memqcache_method = 'shmem'
          # memqcache_max_num_cache = 1000000
          # memqcache_expire = 300
          # memqcache_auto_cache_invalidation = on
          # memqcache_maxcache = 4096
          # memqcache_cache_block_size = 1048576
          # memqcache_oiddir = '/var/log/pgpool/oiddir'

          # ----------------------------------------------------------------------
          # EXTENSIONS
          # ----------------------------------------------------------------------
          # pgpool_regclass, pgpool_recovery, pgpool_adm
      notify: restart pgpool

    # ============================================================
    # 5. DEPLOY FAILOVER SCRIPTS (NO sudo - CS9 has no sudo by default)
    # ============================================================
    - name: Deploy failover script
      copy:
        dest: "{{ pgpool_conf_dir }}/failover.sh"
        owner: postgres
        group: postgres
        mode: '0755'
        content: |
          #!/bin/bash
          # Failover script for Pgpool-II with Patroni
          # Called when a backend node fails

          FAILED_NODE_ID=$1
          FAILED_NODE_HOST=$2
          FAILED_NODE_PORT=$3
          FAILED_NODE_DATA=$4
          NEW_MASTER_ID=$5
          NEW_MASTER_HOST=$6
          NEW_MASTER_PORT=$7
          OLD_MASTER_ID=$8
          NEW_MASTER_DATA=$9
          OLD_MASTER_DATA=${10}

          LOG_FILE="{{ pgpool_log_dir }}/failover.log"
          PATRONI_CONFIG="/etc/patroni/patroni.yml"

          exec >> "$LOG_FILE" 2>&1
          echo "$(date): Failover triggered - Failed node: $FAILED_NODE_ID ($FAILED_NODE_HOST), New master: $NEW_MASTER_ID ($NEW_MASTER_HOST)"

          if [ "$FAILED_NODE_ID" = "$OLD_MASTER_ID" ]; then
              echo "$(date): Primary failed, Patroni handles leader election via etcd"
              sleep 5
              NEW_LEADER=$(su - postgres -c "patronictl -c $PATRONI_CONFIG list -f json 2>/dev/null | jq -r '.[] | select(.Role==\"Leader\") | .Member'")
              echo "$(date): New Patroni leader: $NEW_LEADER"
          else
              echo "$(date): Replica failed - no action needed"
          fi

          exit 0

    - name: Deploy follow_master script
      copy:
        dest: "{{ pgpool_conf_dir }}/follow_master.sh"
        owner: postgres
        group: postgres
        mode: '0755'
        content: |
          #!/bin/bash
          # Follow master script for Pgpool-II with Patroni

          FAILED_NODE_ID=$1
          FAILED_NODE_HOST=$2
          FAILED_NODE_PORT=$3
          FAILED_NODE_DATA=$4
          NEW_MASTER_ID=$5
          NEW_MASTER_HOST=$6
          NEW_MASTER_PORT=$7
          OLD_MASTER_ID=$8
          NEW_MASTER_DATA=$9
          OLD_MASTER_DATA=${10}

          LOG_FILE="{{ pgpool_log_dir }}/failover.log"
          PATRONI_CONFIG="/etc/patroni/patroni.yml"

          exec >> "$LOG_FILE" 2>&1
          echo "$(date): Follow master triggered - New master: $NEW_MASTER_ID ($NEW_MASTER_HOST)"

          sleep 3
          NEW_LEADER=$(su - postgres -c "patronictl -c $PATRONI_CONFIG list -f json 2>/dev/null | jq -r '.[] | select(.Role==\"Leader\") | .Member'")
          echo "$(date): Confirmed Patroni leader: $NEW_LEADER"

          exit 0

    # ============================================================
    # 6. CONFIGURE WATCHDOG (pgpool_watchdog.conf) - ALL INLINE
    # ============================================================
    - name: Configure pgpool_watchdog.conf
      copy:
        dest: "{{ pgpool_conf_dir }}/pgpool_watchdog.conf"
        owner: postgres
        group: postgres
        mode: '0644'
        content: |
          # ============================================================
          # Pgpool-II Watchdog Configuration
          # Generated by Ansible - DO NOT EDIT DIRECTLY
          # ============================================================

          use_watchdog = on
          wd_lifecheck_method = heartbeat
          wd_monitoring_interfaces_list = '{{ vip_interface }}'
          # Watchdog nodes - indexed tuples, ALL 3 on EVERY node (Pgpool 4.7 format)
          {% for node in groups['pg_nodes'] %}
          hostname{{ loop.index0 }} = '{{ hostvars[node]['ansible_default_ipv4']['address'] }}'
          wd_port{{ loop.index0 }} = {{ wd_port }}
          pgpool_port{{ loop.index0 }} = {{ pgpool_port }}
          {% endfor %}
          # Local node priority + auth key (single params, not indexed, in 4.7)
          wd_priority = {{ wd_priority_base + (3 - (node_index | int)) }}
          wd_authkey = ''

          # Heartbeat lifecheck - 4.7 names
          {% for node in groups['pg_nodes'] %}
          heartbeat_hostname{{ loop.index0 }} = '{{ hostvars[node]['ansible_default_ipv4']['address'] }}'
          heartbeat_port{{ loop.index0 }} = {{ wd_port }}
          heartbeat_device{{ loop.index0 }} = '{{ vip_interface }}'
          {% endfor %}

          # Virtual IP (VIP) management
          delegate_ip = '{{ vip }}'
          if_cmd_path = '{{ if_cmd_path }}'
          if_up_cmd = '{{ if_cmd_path }}/ip addr add {{ vip }}/{{ vip_cidr }} dev {{ vip_interface }} label {{ vip_interface }}:pgpool'
          if_down_cmd = '{{ if_cmd_path }}/ip addr del {{ vip }}/{{ vip_cidr }} dev {{ vip_interface }}'
          arping_path = '{{ arping_path }}'
          arping_cmd = '{{ arping_path }}/arping -U {{ vip }} -w 1 -I {{ vip_interface }}'
      notify: restart pgpool

    # ============================================================
    # 7. SYSTEMD OVERRIDES (VIP capabilities + fast stop)
    # ============================================================
    - name: Create systemd directory for pgpool
      file:
        path: /etc/systemd/system/{{ pgpool_service_name }}.service.d
        state: directory
        mode: '0755'

    - name: Create systemd override (VIP capabilities + fast stop)
      copy:
        dest: /etc/systemd/system/{{ pgpool_service_name }}.service.d/override.conf
        content: |
          [Service]
          # Allow pgpool to manage VIP via ip/arping
          CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_DAC_OVERRIDE
          AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_DAC_OVERRIDE
          # Watchdog ignores SIGTERM during shutdown - force fast stop
          TimeoutStopSec=3
          SendSIGKILL=yes
        mode: '0644'
      notify: restart pgpool

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    # ============================================================
    # 8. SUDOERS FOR VIP COMMANDS (postgres needs ip/arping)
    # ============================================================
    - name: Configure sudoers for pgpool VIP management
      copy:
        dest: /etc/sudoers.d/pgpool-vip
        content: |
          # Allow postgres user to run VIP management commands without password
          postgres ALL=(ALL) NOPASSWD: {{ if_cmd_path }}/ip, {{ arping_path }}/arping
        mode: '0440'
        validate: 'visudo -cf %s'
      ignore_errors: true

    # ============================================================
    # 9. ENABLE AND START PGROOL SERVICE
    # ============================================================
    - name: Enable pgpool service
      systemd:
        name: "{{ pgpool_service_name }}"
        enabled: yes

    - name: Start pgpool service
      systemd:
        name: "{{ pgpool_service_name }}"
        state: started

    # ============================================================
    # 10. VERIFY WATCHDOG CLUSTER FORMATION
    # ============================================================
    - name: Wait for watchdog to stabilize
      pause:
        seconds: 15

    - name: Check watchdog status via PCP
      shell: |
        PCPPASSFILE={{ pgpool_conf_dir }}/.pcppass pcp_watchdog_info -h localhost -p {{ pcp_port }} -U {{ pcp_user }} -w
      register: wd_info
      changed_when: false
      ignore_errors: true

    - name: Display watchdog status
      debug:
        var: wd_info.stdout_lines
      when: wd_info.stdout is defined

    - name: Verify VIP is assigned to leader
      shell: |
        ip addr show {{ vip_interface }} | grep "{{ vip }}" || true
      register: vip_check
      changed_when: false

    - name: Display VIP status
      debug:
        msg: "VIP {{ vip }} present on {{ inventory_hostname }}: {{ vip_check.stdout != '' }}"

  handlers:
    - name: restart pgpool
      systemd:
        name: "{{ pgpool_service_name }}"
        state: restarted