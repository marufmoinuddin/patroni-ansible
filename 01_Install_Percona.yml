---
- name: Set up locale (Debian/Ubuntu only)
  hosts: pg_nodes
  become: true
  tasks:
    - name: Uncomment en_US.UTF-8 and en_IN.UTF-8 in /etc/locale.gen
      ansible.builtin.shell:
        cmd: |
          sed -i '/^#.*en_US.UTF-8/s/^#//' /etc/locale.gen
          sed -i '/^#.*en_IN.UTF-8/s/^#//' /etc/locale.gen
        creates: /etc/locale.gen
      when: ansible_os_family == "Debian"

    - name: Regenerate locales
      ansible.builtin.command:
        cmd: locale-gen
      when: ansible_os_family == "Debian"

    - name: Set locales in /etc/default/locale
      ansible.builtin.lineinfile:
        path: /etc/default/locale
        line: "{{ item }}"
        create: yes
      loop:
        - "LANG=en_US.UTF-8"
        - "LANGUAGE=en_US.UTF-8"
        - "LC_ALL=en_US.UTF-8"
      when: ansible_os_family == "Debian"

    - name: Set locale on RHEL/CentOS
      ansible.builtin.lineinfile:
        path: /etc/locale.conf
        line: "{{ item }}"
        create: yes
      loop:
        - "LANG=en_US.UTF-8"
        - "LC_ALL=en_US.UTF-8"
      when: ansible_os_family == "RedHat"

- name: Purge existing Patroni and PostgreSQL installations in all nodes
  hosts: all
  become: true
  tasks:
    - name: Stop and disable Patroni, PostgreSQL, Pgpool services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - patroni
        - postgresql-16
        - postgresql
        - pgpool2
        - pgpool
      ignore_errors: true

    - name: Purge Patroni and PostgreSQL packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - percona-patroni
          - percona-postgresql-16
          - postgresql-16
          - postgresql-client-16
        state: absent
        purge: yes
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Remove Patroni and PostgreSQL packages (RHEL/CentOS)
      ansible.builtin.dnf:
        name:
          - percona-patroni
          - percona-postgresql16-server
          - percona-postgresql16
          - postgresql16-server
          - postgresql16
        state: absent
      ignore_errors: true
      when: ansible_os_family == "RedHat"

    - name: Purge pgbackrest package (Debian/Ubuntu)
      ansible.builtin.apt:
        name: percona-pgbackrest
        state: absent
        purge: yes
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Remove pgbackrest package (RHEL/CentOS)
      ansible.builtin.dnf:
        name: percona-pgbackrest
        state: absent
      ignore_errors: true
      when: ansible_os_family == "RedHat"

    - name: Remove Pgpool packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - percona-pgpool16
          - postgresql-16-pgpool2
        state: absent
        purge: yes
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Install python3-docker on pgBackRest node (for docker module)
      ansible.builtin.dnf:
        name: python3-docker
        state: present
        enablerepo: epel
      when: ansible_os_family == "RedHat"
      delegate_to: "{{ groups['pg_backrest'][0] }}"
      run_once: true

    - name: Remove remaining PostgreSQL directories (Debian/Ubuntu)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/postgresql
        - /etc/postgresql
        - /var/log/postgresql
      ignore_errors: true
      when: ansible_os_family == "Debian"

    - name: Remove remaining PostgreSQL directories (RHEL/CentOS)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/pgsql/16
        - /var/lib/pgsql/16/data
        - /etc/pgpool2
        - /var/log/pgpool2
      ignore_errors: true
      when: ansible_os_family == "RedHat"

    - name: Remove pgbackrest directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/pgbackrest.conf
        - /etc/pgbackrest
        - /var/log/pgbackrest
        - /var/lib/pgbackrest
      ignore_errors: true

- name: Install Percona Distribution and dependencies on all nodes
  hosts: all
  become: true
  vars:
    percona_repo_deb_url: "https://repo.percona.com/apt/percona-release_latest.generic_all.deb"
    percona_repo_rpm_url: "https://repo.percona.com/yum/percona-release-latest.noarch.rpm"
  tasks:
    - name: Install curl and wget (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - gnupg2
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install curl and wget (RHEL/CentOS)
      ansible.builtin.dnf:
        name:
          - curl
          - wget
          - gnupg2
        state: present
      when: ansible_os_family == "RedHat"

    # --- Debian/Ubuntu repo setup ---
    - name: Download the percona-release repository package (Debian)
      ansible.builtin.get_url:
        url: "{{ percona_repo_deb_url }}"
        dest: /tmp/percona-release_latest.generic_all.deb
      when: ansible_os_family == "Debian"

    - name: Install the percona-release repository package (Debian)
      ansible.builtin.apt:
        deb: /tmp/percona-release_latest.generic_all.deb
      when: ansible_os_family == "Debian"

    - name: Refresh the local apt cache
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Enable the repository for Percona PostgreSQL 16 (Debian)
      ansible.builtin.command:
        cmd: percona-release setup ppg-16
      when: ansible_os_family == "Debian"

    # --- RHEL/CentOS repo setup ---
    - name: Enable EPEL repository (RHEL/CentOS)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_os_family == "RedHat"

    - name: Enable CRB repository (RHEL/CentOS Stream)
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled crb
      register: crb_result
      changed_when: crb_result.rc == 0
      when: ansible_os_family == "RedHat"

    - name: Install percona-release repository (RHEL/CentOS)
      ansible.builtin.dnf:
        name: "{{ percona_repo_rpm_url }}"
        state: present
        disable_gpg_check: true  # key is installed by the RPM itself
      when: ansible_os_family == "RedHat"

    - name: Enable Percona PostgreSQL 16 repository (RHEL/CentOS)
      ansible.builtin.command:
        cmd: percona-release setup ppg-16
      when: ansible_os_family == "RedHat"

- name: Install pgBackRest on PG Backrest Node
  hosts: pg_backrest
  become: true
  tasks:
    - name: Install pgBackRest package (Debian/Ubuntu)
      ansible.builtin.apt:
        name: percona-pgbackrest
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install pgBackRest package (RHEL/CentOS)
      ansible.builtin.dnf:
        name: percona-pgbackrest
        state: present
      when: ansible_os_family == "RedHat"

- name: Install ETCD, Patroni, PostgreSQL 16, and Pgpool-II on PostgreSQL Nodes
  hosts: pg_nodes
  become: true
  tasks:
    - name: Install Percona PostgreSQL 16 packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: percona-postgresql-16
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Percona PostgreSQL 16 packages (RHEL/CentOS)
      ansible.builtin.dnf:
        name:
          - percona-postgresql16-server
          - percona-postgresql16
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Python and auxiliary packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-dev
          - python3-psycopg2
          - binutils
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Python and auxiliary packages (RHEL/CentOS)
      ansible.builtin.dnf:
        name:
          - python3-pip
          - python3-devel
          - python3-psycopg2
          - binutils
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install ETCD, Patroni, and pgBackRest packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - percona-patroni
          - etcd
          - percona-pgbackrest
        state: present
      when: ansible_os_family == "Debian"

    - name: Install ETCD, Patroni, and pgBackRest packages (RHEL/CentOS)
      ansible.builtin.dnf:
        name:
          - percona-patroni
          - percona-patroni-etcd
          - etcd
          - percona-pgbackrest
          - jq
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Pgpool-II (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - percona-pgpool16
          - postgresql-16-pgpool2
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Pgpool-II (RHEL/CentOS)
      ansible.builtin.dnf:
        name:
          - percona-pgpool-II-pg16
          - percona-pgpool-II-pg16-extensions
        state: present
      when: ansible_os_family == "RedHat"

    - name: Stop and disable all installed services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - etcd
        - patroni
        - postgresql-16
        - pgpool2
      ignore_errors: true

    - name: Remove the existing Postgres data directory (Debian/Ubuntu)
      ansible.builtin.file:
        path: /var/lib/postgresql/16/main
        state: absent
        force: yes
      when: ansible_os_family == "Debian"

    - name: Remove the existing Postgres data directory (RHEL/CentOS)
      ansible.builtin.file:
        path: /var/lib/pgsql/16/data
        state: absent
        force: yes
      when: ansible_os_family == "RedHat"