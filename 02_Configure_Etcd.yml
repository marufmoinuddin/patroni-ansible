---
- name: Configure ETCD on PostgreSQL nodes
  hosts: pg_nodes
  become: true
  gather_facts: true
  vars_files:
    - variables.yaml

  tasks:
    - name: Check if etcd is already installed
      ansible.builtin.command: which etcd
      register: etcd_check
      changed_when: false
      failed_when: false

    - name: Install ETCD package (RHEL/CentOS) - only if not already installed
      ansible.builtin.dnf:
        name: etcd
        state: present
      when: ansible_os_family == "RedHat" and etcd_check.rc != 0

    - name: Create ETCD data directory
      ansible.builtin.file:
        path: "{{ etcd_data_dir }}"
        state: directory
        mode: '0755'

    - name: Remove stale ETCD data (fresh cluster bootstrap)
      ansible.builtin.find:
        paths: "{{ etcd_data_dir }}"
        file_type: any
      register: etcd_stale

    - name: Wipe ETCD data directory contents
      ansible.builtin.shell: "rm -rf {{ etcd_data_dir }}/*"
      when: etcd_stale.files | length > 0
      changed_when: true

    - name: Set ETCD cluster string (simple approach)
      ansible.builtin.set_fact:
        etcd_cluster: "centos-patroni-1=http://192.168.122.200:2380,centos-patroni-2=http://192.168.122.201:2380,centos-patroni-3=http://192.168.122.202:2380"

    - name: Create systemd service file
      ansible.builtin.template:
        src: etcd.service.j2
        dest: /etc/systemd/system/etcd.service
        mode: '0644'

    - name: Reload systemd configuration
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Enable ETCD service
      ansible.builtin.systemd:
        name: etcd
        enabled: yes

    - name: Start ETCD service
      ansible.builtin.systemd:
        name: etcd
        state: started

    # Verification Tasks
    - name: Delay 30 seconds for ETCD service to start
      ansible.builtin.pause:
        seconds: 30

    - name: Check ETCD service status
      ansible.builtin.command: systemctl status etcd
      register: etcd_status
      changed_when: false
      ignore_errors: true

    - name: Display ETCD service status
      ansible.builtin.debug:
        var: etcd_status.stdout_lines

    - name: Verify cluster member list
      ansible.builtin.command: "etcdctl --endpoints={{ etcd_endpoints }} member list"
      environment:
        ETCDCTL_API: "3"
      register: member_list
      changed_when: false
      run_once: true
      ignore_errors: true

    - name: Display cluster member list
      ansible.builtin.debug:
        var: member_list.stdout_lines
      run_once: true

    - name: Check cluster health
      ansible.builtin.command: "etcdctl --endpoints={{ etcd_endpoints }} endpoint health"
      environment:
        ETCDCTL_API: "3"
      register: cluster_health
      changed_when: false
      run_once: true
      ignore_errors: true

    - name: Display cluster health
      ansible.builtin.debug:
        var: cluster_health.stdout_lines
      run_once: true